# Publishes the libraries to GitHub Packages when a GitHub release is created, or, run by hand, for an existing tag.
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven GitHub Publish

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to publish, e.g. v3.0.0'
        required: true

jobs:
  release:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag || github.ref }}
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'zulu'
        java-package: 'jdk+fx'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    # The build resolves com.druvu dependencies from GitHub Packages too, so it needs the same credentials as the deploy.
    - name: Build and publish to GitHub Packages
      run: mvn -B deploy -s $GITHUB_WORKSPACE/settings.xml
      env:
        GITHUB_TOKEN: ${{ github.token }}
